name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Build and verify committed app
        run: |
          python3 build.py
          git diff --exit-code -- speed-tiers.html
      - name: Check calculations, migrations, sharing, and UI
        run: npm test
      - name: Prepare standalone app
        run: |
          mkdir -p _site
          cp speed-tiers.html _site/index.html
          cp speed-tiers.html _site/speed-tiers.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

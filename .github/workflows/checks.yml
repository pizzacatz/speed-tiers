name: Check app
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify standalone build
        run: |
          python3 build.py
          git diff --exit-code -- speed-tiers.html
      - run: npm test

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions Speed Tiers</title>
<style>
:root{
  --bg:#f5f6f8;--bg2:#ffffff;--bg3:#eceef2;--fg:#1b1e24;--fg2:#5b6270;--line:#d9dde4;
  --acc:#2f6fed;--acc2:#e6eefc;--faster:#1f9d55;--slower:#d64545;--tie:#c98a00;--anchor:#7c3aed;--anchorbg:#f1e9ff;
  --band:#f0f2f6;--shadow:0 6px 24px rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141a;--bg2:#1a1d25;--bg3:#232733;--fg:#e6e8ee;--fg2:#9aa2b3;--line:#2d3240;
  --acc:#5b8cff;--acc2:#1f2b48;--faster:#3ccb77;--slower:#ff6b6b;--tie:#f0b429;--anchor:#a78bfa;--anchorbg:#2a2140;
  --band:#161922;--shadow:0 6px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#12141a;--bg2:#1a1d25;--bg3:#232733;--fg:#e6e8ee;--fg2:#9aa2b3;--line:#2d3240;
  --acc:#5b8cff;--acc2:#1f2b48;--faster:#3ccb77;--slower:#ff6b6b;--tie:#f0b429;--anchor:#a78bfa;--anchorbg:#2a2140;
  --band:#161922;--shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:40px}
button,select,input{font:inherit;color:inherit}
button{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:2px 7px;font-size:12px}
button.ghost{background:transparent}
button.danger{border-color:var(--slower);color:var(--slower)}
input[type=text],input[type=number],input[type=search],select{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
input[type=range]{accent-color:var(--acc)}
.muted{color:var(--fg2)}
#top{position:sticky;top:0;z-index:20;background:var(--bg2);box-shadow:0 2px 8px rgba(0,0,0,.12)}
header{border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.group .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin-right:2px}
.toolbar{padding:6px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-bottom:1px solid var(--line);background:var(--bg)}
.tagchip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid transparent;cursor:pointer;background:var(--bg3)}
.tagchip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tagchip.on{border-color:var(--fg)}
.tagchip.mini{padding:0 6px;font-size:11px;cursor:default}
.colchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.colchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--bg2);cursor:grab;font-size:12px;user-select:none}
.colchip.hidden{opacity:.45}
.colchip.sort{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.colchip .x{cursor:pointer;opacity:.7}
.colchip .x:hover{opacity:1}
.colchip.dragover{outline:2px dashed var(--acc)}
main{padding:0 14px}
table{border-collapse:separate;border-spacing:0;width:auto;table-layout:auto;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:var(--topH,0px);z-index:5;background:var(--bg2);border-bottom:2px solid var(--line);padding:6px 8px;text-align:right;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;position:sticky}
thead th{overflow:visible}
.rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6}
.rz:hover,.rz.active{background:var(--acc)}
body.resizing{cursor:col-resize;user-select:none}
tbody td.clip{overflow:hidden;text-overflow:ellipsis}
thead th.l{text-align:left}
thead th.sort{color:var(--acc)}
thead th.sort::after{content:" ▼"}
tbody td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody td.l{padding-right:14px}
tbody td.l{text-align:left}
tbody tr.band{background:var(--band)}
tbody tr:hover td{background:var(--acc2)}
tbody tr.anchorrow td{background:var(--anchorbg)}
tbody tr.divider td{background:var(--anchor);color:#fff;text-align:center;font-weight:600;padding:2px;font-size:12px}
.spr{width:28px;height:28px;vertical-align:middle;image-rendering:auto;margin-right:6px;background:var(--bg3);border-radius:6px}
.name{cursor:pointer;font-weight:500}
.name:hover{text-decoration:underline}
.mega{font-size:10px;color:var(--fg2);margin-left:4px}
.type{display:inline-block;font-size:9px;line-height:1;padding:2px 4px;border-radius:3px;color:#fff;margin-left:3px;text-transform:uppercase;font-weight:700;vertical-align:middle}
.cell{cursor:help}
.cell.sortcol{font-weight:700}
.cell .ov{color:var(--anchor);font-size:9px;vertical-align:super}
.badge{display:inline-block;min-width:78px;text-align:center;border-radius:5px;padding:1px 6px;font-size:12px;font-weight:600}
.badge.faster{color:var(--faster);background:color-mix(in srgb,var(--faster) 14%,transparent)}
.badge.slower{color:var(--slower);background:color-mix(in srgb,var(--slower) 14%,transparent)}
.badge.tie{color:var(--tie);background:color-mix(in srgb,var(--tie) 16%,transparent)}
.badge.self{color:var(--anchor)}
.rowactions button{visibility:hidden}
tr:hover .rowactions button{visibility:visible}
/* dock */
#dock{background:var(--anchorbg);border-bottom:2px solid var(--anchor);padding:6px 14px;display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center}
#dock .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:100%}
.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer;background:var(--bg3)}
.achip.on{border-color:var(--anchor);background:var(--anchorbg)}
.achip .spr{width:24px;height:24px;margin:0}
.achip b{font-size:15px}
.achip .x{opacity:.6;margin-left:2px}
.achip .x:hover{opacity:1;color:var(--slower)}
#dockEd{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;flex:1}
#dockEd .big{font-size:24px;font-weight:700;color:var(--anchor);min-width:56px}
.ctl{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--fg2)}
.ctl > *{font-size:13px;color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 8px;background:var(--bg2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#fff}
#solve{font-size:12px;color:var(--fg2)}
.summ{font-size:12px;color:var(--fg2)}
.dockline{flex-basis:100%;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
#solve b{color:var(--fg)}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:340px;max-width:720px;width:100%}
.modal h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.modal h3{margin:14px 0 6px;font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.frow{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}
.list{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.list .it{display:flex;align-items:center;gap:8px;padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--line)}
.list .it:hover{background:var(--acc2)}
.steps{font-size:12px;color:var(--fg2);margin:4px 0 0 0;padding-left:16px}
.steps b{color:var(--fg)}
.tagrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tagrow input[type=color]{width:28px;height:24px;padding:0;border:0;background:none}
.stat{font-size:11px;color:var(--fg2)}
footer{padding:14px;color:var(--fg2);font-size:11px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px;background:var(--bg3)}
.help{cursor:help;border-bottom:1px dotted var(--fg2)}
@media (max-width:800px){.badge{min-width:60px}}
</style>
</head>
<body>
<div id="top">
<header>
  <h1>⚡ Champions Speed Tiers</h1>
  <div class="group"><span class="lbl">Weather</span><span class="seg" id="weatherSeg"></span></div>
  <div class="group"><button id="btnET" title="Electric Terrain (Surge Surfer)">E-Terrain</button>
    <button id="btnTR" title="Trick Room: slower moves first">Trick Room</button></div>
  <div class="group"><span class="lbl">Tailwind</span><span class="seg"><button id="twA" title="Tailwind for side A (My Team)">Side A</button><button id="twB" title="Tailwind for side B (Opponent)">Side B</button></span></div>
  <div class="group" style="margin-left:auto">
    <button id="btnTheme" class="sm" title="Toggle theme">◐</button>
    <button id="btnExport" class="sm">Export</button>
    <button id="btnImport" class="sm">Import</button>
    <button id="btnReset" class="sm danger">Reset</button>
    <button id="btnHelp" class="sm">?</button>
  </div>
</header>
<div id="dock"></div>
<div class="toolbar">
  <input type="search" id="search" placeholder="Search species…  ( / )" style="width:200px">
  <button id="btnAdd" class="sm">+ Add row</button>
  <div class="group"><span class="lbl">Tags</span><span id="tagFilters"></span>
    <button id="btnTagMode" class="sm ghost" title="Filter mode">any</button>
    <button id="btnTags" class="sm">Manage tags</button></div>
  <div class="group"><label><input type="checkbox" id="chkMegas" checked> Megas</label>
    <label><input type="checkbox" id="chkOnlyTagged"> Only tagged</label></div>
  <div class="group"><span class="lbl">Columns</span><span class="colchips" id="colChips"></span><button id="btnAddCol" class="sm">+</button>
    <span class="muted" style="font-size:11px">click = sort by, eye = hide, drag = reorder, ⚙ = edit · drag a header edge to resize, double-click it to auto-fit</span></div>
</div>
</div>
<main><table id="tbl"><thead></thead><tbody></tbody></table></main>
<footer id="foot"></footer>
<div id="modalHost"></div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>/*__ENGINE__*/</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const ENT = Object.fromEntries(DATA.entities.map(e => [e.id, e]));
const AB = DATA.abilities;
const LS = 'speedtiers.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const TYPE_COLORS = {normal:'#9a9a7a',fire:'#e8582d',water:'#3d8de5',electric:'#e5b800',grass:'#57b23a',ice:'#6cc9d6',fighting:'#c22e28',poison:'#a33ea1',ground:'#d9b356',flying:'#8fa1e6',psychic:'#f95587',bug:'#8fae2b',rock:'#b6a136',ghost:'#735797',dragon:'#6f35fc',dark:'#705746',steel:'#7f8fa3',fairy:'#d685ad'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- default state ----------
function defaultColumns() {
  return [
    { id: 'min', label: 'Min', spec: { sp: 0, align: -1 }, visible: true },
    { id: 'base', label: 'Base', spec: { sp: 0, align: 0 }, visible: true },
    { id: 'max', label: 'Max', spec: { sp: 32, align: 1 }, visible: true },
    { id: 'scarf', label: 'Scarf', spec: { sp: 32, align: 1, item: 'scarf' }, visible: true },
    { id: 'plus1', label: '+1', spec: { sp: 32, align: 1, stage: 1 }, visible: false },
    { id: 'minus1', label: '−1', spec: { sp: 32, align: 1, stage: -1 }, visible: false },
    { id: 'tw', label: 'Tailwind', spec: { sp: 32, align: 1, tailwind: true }, visible: true },
    { id: 'scarftw', label: 'Scarf+TW', spec: { sp: 32, align: 1, item: 'scarf', tailwind: true }, visible: false },
  ];
}
function defaultTags() {
  return [
    { id: 'team', name: 'My Team', color: '#3b82f6', defaults: { side: 'A' } },
    { id: 'opp', name: 'Opponent', color: '#ef4444', defaults: { side: 'B' } },
    { id: 'watch', name: 'Watchlist', color: '#9ca3af', defaults: {} },
    { id: 'tr', name: 'Trick Room', color: '#a855f7', defaults: { sp: 0, align: -1 } },
    { id: 'scarfer', name: 'Scarfer', color: '#f97316', defaults: { item: 'scarf' } },
  ];
}
function defaultState() {
  return {
    v: 1, field: { weather: null, eterrain: false, trickRoom: false, tailwind: { A: false, B: false } },
    global: {}, columns: defaultColumns(), sortCol: 'max', tags: defaultTags(),
    rows: DATA.entities.map(e => ({ id: uid(), ent: e.id, tags: [], ov: {} })),
    anchors: [], activeAnchor: null,
    filters: { tags: [], mode: 'any', search: '', onlyTagged: false, megas: true },
    theme: 'auto', colWidths: {},
  };
}
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.v === 1) { // drop rows for entities that no longer exist
      s.rows = s.rows.filter(r => ENT[r.ent]); s.anchors = s.anchors.filter(a => s.rows.some(r => r.id === a.rowId)); s.colWidths = s.colWidths || {}; return s; } } catch (e) {}
  return defaultState();
}
let saveT; function save() { clearTimeout(saveT); saveT = setTimeout(() => localStorage.setItem(LS, JSON.stringify(S)), 150); }
function commit() { save(); render(); }

// ---------- resolution ----------
const tagById = id => S.tags.find(t => t.id === id);
function rowLayers(row) { return [S.global, ...row.tags.map(id => tagById(id)?.defaults), row.ov]; }
function specFor(row, col) { return Engine.merge(S.global, col.spec, ...row.tags.map(id => tagById(id)?.defaults), row.ov); }
function overriddenKeys(row, col) { // keys of col.spec that a tag/override changed
  const later = Engine.merge(...row.tags.map(id => tagById(id)?.defaults), row.ov);
  const set = new Set(); for (const l of [...row.tags.map(id => tagById(id)?.defaults), row.ov]) if (l) for (const k in l) if (l[k] !== undefined && l[k] !== null) set.add(k);
  return [...set].filter(k => k in col.spec && col.spec[k] !== later[k]);
}
function calc(row, col) { return Engine.compute(ENT[row.ent], specFor(row, col), S.field, AB); }
const sortColumn = () => S.columns.find(c => c.id === S.sortCol) || S.columns.find(c => c.visible) || S.columns[0];
function anchorSpecInit(row) { return Engine.merge(S.global, sortColumn().spec, ...row.tags.map(id => tagById(id)?.defaults), row.ov); }
function anchorCalc(a) { const row = S.rows.find(r => r.id === a.rowId); return row ? Engine.compute(ENT[row.ent], Engine.merge(a.spec), S.field, AB) : null; }
const activeAnchor = () => S.anchors.find(a => a.id === S.activeAnchor) || null;

// ---------- render ----------
const $ = id => document.getElementById(id);
function render() {
  document.documentElement.dataset.theme = S.theme === 'auto' ? '' : S.theme;
  renderHeader(); renderToolbar(); renderTable(); renderDock();
  $('foot').innerHTML = `Data: Regulation ${esc(DATA.meta.regulation)} · ${esc(DATA.meta.dataVersion)} · rev ${esc(DATA.meta.dataRevision)} · ${DATA.meta.species} species + ${DATA.meta.megas} Megas · built ${esc(DATA.meta.built)} from champions-logic. Speed = ⌊(Base+20+SP)×Alignment⌋ then stage → ability → item → Tailwind → paralysis, flooring after each. Row facts (tags, overrides) override column presets for the fields they set.`;
}
function renderHeader() {
  const f = S.field;
  $('weatherSeg').innerHTML = [['', 'None'], ['sun', '☀ Sun'], ['rain', '🌧 Rain'], ['sand', '🏜 Sand'], ['snow', '❄ Snow']]
    .map(([v, l]) => `<button data-w="${v}" class="${(f.weather || '') === v ? 'on' : ''}">${l}</button>`).join('');
  $('btnET').className = f.eterrain ? 'on' : ''; $('btnTR').className = f.trickRoom ? 'on' : '';
  $('twA').className = f.tailwind.A ? 'on' : ''; $('twB').className = f.tailwind.B ? 'on' : '';
}
function renderToolbar() {
  $('tagFilters').innerHTML = S.tags.map(t => `<span class="tagchip ${S.filters.tags.includes(t.id) ? 'on' : ''}" data-tag="${t.id}"><span class="dot" style="background:${t.color}"></span>${esc(t.name)} <span class="muted">${S.rows.filter(r => r.tags.includes(t.id)).length}</span></span>`).join(' ');
  $('btnTagMode').textContent = S.filters.mode; $('chkMegas').checked = S.filters.megas; $('chkOnlyTagged').checked = S.filters.onlyTagged;
  if ($('search').value !== S.filters.search) $('search').value = S.filters.search;
  $('colChips').innerHTML = S.columns.map(c => `<span class="colchip ${c.visible ? '' : 'hidden'} ${c.id === S.sortCol ? 'sort' : ''}" draggable="true" data-col="${c.id}" title="${esc(specSummary(c.spec))}"><span class="x" data-act="eye" title="show/hide">${c.visible ? '👁' : '◌'}</span><span data-act="sort">${esc(c.label)}</span><span class="x" data-act="edit" title="edit">⚙</span></span>`).join('');
}
function specSummary(sp) {
  const p = [];
  if (sp.sp != null) p.push(`SP ${sp.sp}`); if (sp.align != null) p.push(sp.align > 0 ? '+Spe' : sp.align < 0 ? '−Spe' : 'neutral');
  if (sp.stage) p.push(`stage ${sp.stage > 0 ? '+' : ''}${sp.stage}`); if (sp.item && sp.item !== 'none') p.push(Engine.ITEM_LABEL[sp.item]);
  if (sp.abil && sp.abil !== 'auto') p.push(`ability ${sp.abil}`); if (sp.tailwind) p.push('Tailwind'); if (sp.para) p.push('paralyzed');
  if (sp.priority) p.push(`priority ${sp.priority > 0 ? '+' : ''}${sp.priority}`); if (sp.side) p.push(`side ${sp.side}`);
  return p.join(', ') || 'inherit all';
}
function visibleRows() {
  const q = S.filters.search.trim().toLowerCase();
  return S.rows.filter(r => {
    const e = ENT[r.ent];
    if (!S.filters.megas && e.mega) return false;
    if (S.filters.onlyTagged && !r.tags.length) return false;
    if (S.filters.tags.length) { const has = S.filters.tags.map(t => r.tags.includes(t)); if (S.filters.mode === 'any' ? !has.some(Boolean) : !has.every(Boolean)) return false; }
    if (q && !e.name.toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderTable() {
  const cols = S.columns.filter(c => c.visible); const sc = sortColumn(); const tr = S.field.trickRoom;
  const anc = activeAnchor(); const ancC = anc ? anchorCalc(anc) : null;
  const rows = visibleRows().map(r => { const cells = {}; for (const c of cols) cells[c.id] = calc(r, c); const key = cells[sc.id] || calc(r, sc); return { r, cells, key }; });
  rows.sort((a, b) => Engine.comparator(tr)(a.key, b.key) || ENT[a.r.ent].name.localeCompare(ENT[b.r.ent].name));
  const cmp = Engine.comparator(tr);
  const W = k => S.colWidths[k] ? ` style="width:${S.colWidths[k]}px;min-width:${S.colWidths[k]}px;max-width:${S.colWidths[k]}px"` : '';
  const RZ = k => `<span class="rz" data-rz="${k}" title="Drag to resize · double-click to auto-fit"></span>`;
  let h = `<tr><th class="l" data-key="name"${W('name')}>Pokémon${RZ('name')}</th><th class="l" data-key="tags"${W('tags')}>Tags${RZ('tags')}</th>` + cols.map(c => `<th data-sort="${c.id}" data-key="${c.id}"${W(c.id)} class="${c.id === sc.id ? 'sort' : ''}" title="${esc(specSummary(c.spec))}">${esc(c.label)}${RZ(c.id)}</th>`).join('') +
    `<th data-key="vs"${W('vs')} title="Relative to active anchor at the sort column">vs ${anc ? esc(ENT[S.rows.find(x => x.id === anc.rowId).ent].name) : 'anchor'}${RZ('vs')}</th><th></th></tr>`;
  $('tbl').tHead.innerHTML = h;
  let out = [], band = false, lastSpeed = null, lastP = null, dividerDone = !ancC;
  for (const { r, cells, key } of rows) {
    if (!dividerDone && cmp(ancC, key) < 0) { out.push(dividerRow(anc, ancC, cols.length)); dividerDone = true; }
    if (key.speed !== lastSpeed || key.priority !== lastP) { band = !band; lastSpeed = key.speed; lastP = key.priority; }
    const e = ENT[r.ent]; const isAnchor = anc && anc.rowId === r.id;
    let rel = ''; if (ancC && !isAnchor) { const rl = Engine.relation(key, ancC, tr); const d = key.speed - ancC.speed; rel = `<span class="badge ${rl}">${rl === 'tie' ? 'speed tie' : rl === 'faster' ? 'outspeeds' : 'slower'} ${d > 0 ? '+' + d : d}</span>`; }
    else if (isAnchor) rel = `<span class="badge self">◆ anchor</span>`;

      cols.map(c => { const v = cells[c.id]; const ok = overriddenKeys(r, c); return `<td class="cell ${c.id === sc.id ? 'sortcol' : ''}" data-col="${c.id}" title="${esc(v.steps.map(s => `${s.label} → ${s.value}`).join('\n'))}${ok.length ? '\n(overridden: ' + ok.join(', ') + ')' : ''}">${v.priority ? `<span class="muted" style="font-size:10px">p${v.priority > 0 ? '+' : ''}${v.priority} </span>` : ''}${v.speed}${ok.length ? '<span class="ov">●</span>' : ''}</td>`; }).join('') +

function specControls(sp, partial, e) { // partial=true adds "inherit" options; returns HTML with data-k controls

function modal(html, onMount) {

function closeModal() { $('modalHost').innerHTML = ''; }
function partialFromControls(root) { const o = {}; root.querySelectorAll('[data-k]').forEach(el => { if (el.type === 'range') return; const [k, v] = readControl(el); if (v !== undefined) o[k] = v; }); return o; }

    m => {

// ---------- actions ----------
function pin(rowId) { let a = S.anchors.find(x => x.rowId === rowId); if (!a) { const row = S.rows.find(r => r.id === rowId); a = { id: uid(), rowId, spec: anchorSpecInit(row) }; S.anchors.push(a); } S.activeAnchor = a.id; commit(); }
function dupRow(rowId) { const i = S.rows.findIndex(r => r.id === rowId); const r = S.rows[i]; S.rows.splice(i + 1, 0, { id: uid(), ent: r.ent, tags: [...r.tags], ov: { ...r.ov } }); commit(); }
function delRow(rowId) { S.rows = S.rows.filter(r => r.id !== rowId); S.anchors = S.anchors.filter(a => a.rowId !== rowId); if (!S.anchors.some(a => a.id === S.activeAnchor)) S.activeAnchor = S.anchors[0]?.id || null; commit(); }
function exportJSON() { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `speed-tiers-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href); }

$('colChips').addEventListener('dragover', ev => { const chip = ev.target.closest('.colchip'); if (chip) { ev.preventDefault(); chip.classList.add('dragover'); } });
$('colChips').addEventListener('dragleave', ev => { const chip = ev.target.closest('.colchip'); if (chip) chip.classList.remove('dragover'); });
$('colChips').addEventListener('drop', ev => { const chip = ev.target.closest('.colchip'); if (!chip || !dragId) return; ev.preventDefault(); const from = S.columns.findIndex(c => c.id === dragId), to = S.columns.findIndex(c => c.id === chip.dataset.col); if (from < 0 || to < 0 || from === to) return; const [c] = S.columns.splice(from, 1); S.columns.splice(to, 0, c); dragId = null; commit(); });
let rzState = null;
$('tbl').addEventListener('mousedown', ev => { const rz = ev.target.closest('.rz'); if (!rz) return; ev.preventDefault(); ev.stopPropagation(); const th = rz.parentElement; rzState = { key: rz.dataset.rz, startX: ev.clientX, startW: th.getBoundingClientRect().width, th }; rz.classList.add('active'); document.body.classList.add('resizing'); });
document.addEventListener('mousemove', ev => { if (!rzState) return; const w = Math.max(40, Math.round(rzState.startW + ev.clientX - rzState.startX)); rzState.th.style.width = rzState.th.style.minWidth = rzState.th.style.maxWidth = w + 'px'; rzState.w = w; });
document.addEventListener('mouseup', () => { if (!rzState) return; if (rzState.w) S.colWidths[rzState.key] = rzState.w; document.body.classList.remove('resizing'); rzState = null; commit(); });
$('tbl').addEventListener('dblclick', ev => { const rz = ev.target.closest('.rz'); if (!rz) return; ev.preventDefault(); delete S.colWidths[rz.dataset.rz]; commit(); });
$('tbl').addEventListener('click', ev => {
  if (ev.target.closest('.rz')) return;
  const th = ev.target.closest('th[data-sort]'); if (th) { S.sortCol = th.dataset.sort; commit(); return; }
  const tr = ev.target.closest('tr[data-row]'); if (!tr) return; const id = tr.dataset.row; const act = ev.target.dataset.act;
  if (act === 'pin') pin(id); else if (act === 'dup') dupRow(id); else if (act === 'del') delRow(id); else if (act === 'edit' || ev.target.closest('td.l')) rowEditor(id);
});
$('tbl').addEventListener('mouseover', ev => { const tr = ev.target.closest('tr[data-row]'); const id = tr ? tr.dataset.row : null; if (id !== hoverRowId) { hoverRowId = id; renderSolve(); } });
$('tbl').addEventListener('mouseleave', () => { hoverRowId = null; renderSolve(); });
$('dock').addEventListener('click', ev => {
  if (ev.target.id === 'btnPinTeam') { S.rows.filter(r => r.tags.includes('team')).forEach(r => { if (!S.anchors.some(a => a.rowId === r.id)) S.anchors.push({ id: uid(), rowId: r.id, spec: anchorSpecInit(r) }); }); if (!S.activeAnchor && S.anchors[0]) S.activeAnchor = S.anchors[0].id; commit(); return; }
  const chip = ev.target.closest('.achip'); if (!chip) return; const id = chip.dataset.anchor;
  if (ev.target.dataset.act === 'unpin') { S.anchors = S.anchors.filter(a => a.id !== id); if (S.activeAnchor === id) S.activeAnchor = S.anchors[0]?.id || null; }
  else S.activeAnchor = id;
  commit();
});
$('dock').addEventListener('input', ev => { const ed = ev.target.closest('#dockEd'); if (!ed || !ev.target.dataset.k) return; const a = S.anchors.find(x => x.id === ed.dataset.anchor); if (!a) return;
  if (ev.target.type === 'range') { const n = ed.querySelector('input[type=number][data-k=sp]'); n.value = ev.target.value; }
  const [k, v] = readControl(ev.target.type === 'range' ? ed.querySelector('input[type=number][data-k=sp]') : ev.target); if (v !== undefined) a.spec[k] = v;
  if (ev.target.type === 'number') { const r = ed.querySelector('input[type=range][data-k=sp]'); r.value = a.spec.sp; }
  save(); // live: update numbers without rebuilding controls (keeps slider focus)
  const c = anchorCalc(a); ed.querySelector('.big').textContent = c.speed; ed.querySelector('.big').title = c.steps.map(s => `${s.label} → ${s.value}`).join('\n');
  renderTable(); renderSolve(); renderSummary(); const chip = $('dock').querySelector(`.achip[data-anchor="${a.id}"] b`); if (chip) chip.textContent = c.speed; });
document.addEventListener('keydown', ev => { if (ev.key === '/' && !/input|select|textarea/i.test(document.activeElement.tagName)) { ev.preventDefault(); $('search').focus(); } if (ev.key === 'Escape') closeModal(); });

render();
})();
</script>
